# Ollama service overrides — /etc/systemd/system/ollama.service.d/override.conf
#
# Managed copy. Install with infrastructure/ollama/README.md.
# The only change from the live file as of 2026-10-20 is OLLAMA_KEEP_ALIVE.

[Service]
Environment="OLLAMA_CONTEXT_LENGTH=65536"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_HOST=0.0.0.0:41825"
