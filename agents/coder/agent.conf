# agent.conf - machine-readable settings for the 'coder' agent.
#
# Read by: tools/test-agent.sh  (enforces the limits below)
#          and by lib/runtime.sh, which executes this agent through whichever
#          runtime is named in AGENT_RUNTIME below.
#
# Everything here is plain KEY="value" so you can read and edit it without
# any tooling. The companion file SOUL.md holds the personality - that is the
# part you iterate on.

AGENT_NAME="coder"
AGENT_TITLE="Implementation Engineer"
AGENT_MISSION="Writes, modifies, debugs and reviews code for real projects."
AGENT_REPORTS_TO="cto"

# Which model this agent uses. Must be a role name from config/models.json.
# test-agent.sh resolves it against your hardware, so this same file works on
# a 12GB laptop and a 48GB workstation with no edits.
AGENT_MODEL_ROLE="coding"

# Which program actually executes this agent. Must be a runtime listed in
# config/runtimes.json. The agent is the role; this is the tool doing the job
# today. Swapping this line must not require touching SOUL.md, the tests, or
# this agent's place in the org - that is the whole reason the two are
# separate. See lib/runtime.sh to add a runtime.
AGENT_RUNTIME="ollama"

# --- boundaries -------------------------------------------------------------
AGENT_SAFETY="standard"          # read-only | standard | full

# The narrowing that makes this key worth having.
#
# `standard` allows writing into other agents' workspaces, because the teacher's
# entire job is producing skills in them. That is right for the teacher and wrong
# for the coder: a coder editing another agent's SOUL.md or tests is not doing
# its job, and it is exactly the kind of quiet scope creep that a per-agent
# safety level cannot see. So the coder takes the write and leaves the rest.
#
# The effect in one line: the coder may draft a patch in its own workspace and
# may not modify anything outside it.
#
# Note the gap this exposes: `execute` sits above `standard`, so the coder also
# cannot RUN anything - not even its own tests. Widening that means granting
# `full`, which also grants `config` and `deploy`. There is no rung between
# "write my own files" and "may reconfigure the system", and closing that is an
# open decision rather than something to paper over here.
AGENT_ACTIONS="read,write"      # read | write | write_other | execute | network | config | deploy
AGENT_NETWORK="limited"      # none | limited | unrestricted

# --- budget -----------------------------------------------------------------
# Local models have no token bill, so the real limits are time and turns. An
# agent that loops quietly occupies the GPU and starves every other agent.
#
# MAX_TOKENS is the size of one reply. A code answer plus explanation is
# generous at 1200; past that the agent is writing an essay instead of a patch.
AGENT_MAX_TURNS="40"
AGENT_MAX_TOKENS="1200"
AGENT_TIMEOUT_MIN="30"
AGENT_TEMPERATURE="0"

# Thinking models (qwen3, deepseek-r1) reason in a separate channel. Coding is
# exactly the case that benefits: choosing between several plausible fixes is
# most of the work. Test it both ways and keep whichever scores better.
AGENT_THINK="on"

# --- lifecycle --------------------------------------------------------------
AGENT_STATUS="building"       # building | ready | active

AGENT_LAST_TESTED="2026-09-25T21:59:53+08:00"
AGENT_LAST_SCORE="never"
