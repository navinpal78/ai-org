# =============================================================================
# agent.conf - machine-readable settings for the 'ceo' agent.
#
# Read by: tools/test-agent.sh  (enforces the limits below)
#          and by lib/runtime.sh, which executes this agent through whichever
#          runtime is named in AGENT_RUNTIME below.
# =============================================================================

AGENT_NAME="ceo"
AGENT_TITLE="CEO"
AGENT_MISSION="Decides what the organisation is trying to do and what it is not doing, arbitrates disputes between departments, and refuses work that is not worth doing - as recommendations a human applies."
# The root of the org. Empty, and uniquely so: tools/check-agents.py fails the
# tree if more than one agent has no parent, and fails it if any chain of
# reporting lines does not arrive here. Every other agent names a real agent.
AGENT_REPORTS_TO=""

# Weighing options against each other is reasoning, not recall, and this agent's
# failures are confident ones - which is why it used to share the CTO's role.
#
# It no longer does, and that is the point of the `adjudication` role. On a 24GB
# card `reasoning` resolves to gpt-oss:20b, so the CEO was running the same
# weights as the CTO it arbitrates and as the research-officer it also
# arbitrates. An arbitrator on the audited party's weights is not arbitrating.
# `adjudication` is DeepSeek, a family used nowhere else in the catalog.
#
# The cost is real: a 14B dense model here instead of a 20B MoE on a 24GB card.
# Accepted, because naming the tie-break matters more than knowing more facts
# than either side put forward.
AGENT_MODEL_ROLE="adjudication"

# Enforced by tools/check-agents.py, which fails the build if either of these
# pairs would resolve to the same model at any hardware tier. Both report to
# this agent, and both are parties to disputes it settles.
AGENT_INDEPENDENT_OF="cto research-officer"

# The agent is the role; the runtime is the tool doing the job today. Swapping
# this line must not require touching SOUL.md, the tests, or this agent's place
# in the org. See lib/runtime.sh to add a runtime.
AGENT_RUNTIME="ollama"

# --- boundaries -------------------------------------------------------------
#   read-only  may read, analyse and report. May not modify anything.
#   standard   may edit files inside its own workspace, may not touch system
#              config, credentials, or the network outside its workspace.
#   full       unrestricted. Only for agents running inside a disposable
#              container or VM.
#
# Read-only, for the same reason as the CTO and with a longer fuse. Everything
# below this agent has a ceiling that assumes somebody above it cannot quietly
# move it. If the CEO could write, the first genuinely urgent request would be
# the one that broke that, and it would break it for a good reason, which is
# what makes it the dangerous one.
AGENT_SAFETY="read-only"
AGENT_ACTIONS="read"

#   none          no internet. Everything it needs must be local.
#   limited       may read documentation and its own knowledge base.
#   unrestricted  may browse and use network tools.
#
# None, and this is the one agent where that is easy to justify: the CEO's
# inputs are internal. It has the org chart, the state files and the humans. A
# search would not make its judgement better, and every fact it would find is
# one it has no way to verify.
AGENT_NETWORK="none"

# --- budget -----------------------------------------------------------------
AGENT_MAX_TURNS="40"
# A priority call with the tradeoff that justifies it does not fit in 512, and a
# priority stripped of its tradeoff is how a wrong call gets accepted - the
# reader has nothing to check it against.
AGENT_MAX_TOKENS="1000"
AGENT_TIMEOUT_MIN="30"

# Tests default to temperature 0, so the same prompt gives the same answer and
# a failing score means something changed.
AGENT_TEMPERATURE="0"

# On, and for the same reason as the CTO. Nearly every question at this level is
# "two things are both defensible and only one can happen first", which is a
# wrong-looks-fine call. This is also the agent most tempted to answer fast,
# because a fast answer to a prioritisation question is still a non-answer.
AGENT_THINK="on"

# --- lifecycle --------------------------------------------------------------
# building  still being written. Not wired into anything yet.
# ready     passes its tests. Can be handed real work.
# active    in use, monitored on a schedule.
AGENT_STATUS="building"

# Filled in by tools/test-agent.sh
AGENT_LAST_TESTED="never"
AGENT_LAST_SCORE="never"
