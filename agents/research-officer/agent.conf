# =============================================================================
# agent.conf - machine-readable settings for the 'research-officer' agent.
#
# Read by: tools/test-agent.sh  (enforces the limits below)
#          and by lib/runtime.sh, which executes this agent through whichever
#          runtime is named in AGENT_RUNTIME below.
#
# Everything here is plain KEY="value" so you can read and edit it without
# any tooling. The companion file SOUL.md holds the actual personality and
# instructions - that is the part you iterate on.
# =============================================================================

AGENT_NAME="research-officer"
AGENT_TITLE="Research Officer"
AGENT_MISSION="Decides what is worth researching, routes it to a specialist, and judges whether the answer is good enough to act on."
AGENT_REPORTS_TO="ceo"

# Which model this agent uses. Must be a role name from config/models.json.
# test-agent.sh resolves it against your hardware, so the same agent.conf
# works on a 12GB laptop and a 48GB workstation without edits.
#
# `evidence-review`, not `reasoning`. This agent's whole function is judging the
# strength of evidence, and on `reasoning` it resolved to gpt-oss:20b - the same
# weights as all four specialists whose work it grades. That is the sharpest
# monoculture in the tree, and unlike an engineer sharing a model with the
# manager they report to, a grader sharing weights with the evidence it grades
# is precisely what `adversarial-review` exists to prevent.
#
# `evidence-review` is Cohere (command-r on a 24GB card, aya-expanse:8b below
# that). Weaker than a 20B MoE on small cards, and a steep drop between 24GB and
# 20GB - accepted, because a small distinct model beats a large identical one.
AGENT_MODEL_ROLE="evidence-review"

# All four specialists report to this agent, and this agent grades them. Unlike
# the general parent/child case, where sharing a model is fine, this pair is
# judge-and-judged, so the constraint is declared on the judge. The checker
# fails the build if any of these pairs would resolve to the same model at any
# hardware tier.
AGENT_INDEPENDENT_OF="tech-researcher design-researcher education-researcher web-researcher"

# Which program actually executes this agent. Must be a runtime listed in
# config/runtimes.json. The agent is the role; this is the tool doing the job
# today. Swapping this line must not require touching SOUL.md, the tests, or
# this agent's place in the org - that is the whole reason the two are
# separate. See lib/runtime.sh to add a runtime.
AGENT_RUNTIME="ollama"

# --- boundaries -------------------------------------------------------------
# These exist because a small local model is confident when it is wrong. The
# limits are checked by the test harness so a regression is caught, not just
# intended.
#
#   read-only  may read, analyse and report. May not modify anything.
#   standard   may edit files inside its own workspace, may not touch system
#              config, credentials, or the network outside its workspace.
#   full       unrestricted. Only for agents running inside a disposable
#              container or VM.
AGENT_SAFETY="read-only"

# Same reasoning as the CTO: an officer that could edit the files granting
# permissions could raise its own ceiling. This one also decides what gets
# ingested, and a department that can quietly widen its own sources is a
# department marking its own homework.
AGENT_ACTIONS="read"
#   limited       may read documentation and its own knowledge base.
#   unrestricted  may browse and use network tools.
AGENT_NETWORK="none"
# With local models there is no per-token bill, so the real limits are time and
# turns. An agent that loops will quietly occupy the GPU and starve every other
# agent, so cap it.
#
# MAX_TOKENS is the size of one reply. Keep it as low as the agent's job allows:
# a long answer is usually the agent padding, and padding is a bug for most
# roles.
AGENT_MAX_TURNS="40"
AGENT_MAX_TOKENS="1000"
AGENT_TIMEOUT_MIN="30"

# Tests default to temperature 0, so the same prompt gives the same answer and
# a failing score means something changed. Raise it only when the variation is
# the thing you are testing.
AGENT_TEMPERATURE="0"

# Thinking models (qwen3, deepseek-r1) reason in a separate channel. Turn it on
# for agents that weigh several options (triage, architecture, debugging), and
# leave it off for short-reply agents. Off by default because a thinking model
# can spend the entire token budget reasoning and return an empty reply.
# Open-book in production: this agent is run WITH retrieved sources by
# tools/run-agent.sh. Tests stay closed-book on purpose - see AGENTS.md.
AGENT_RETRIEVAL="on"

# OFF, and this is not a default - it is forced by the model role above, and it
# was a live crash before it was understood.
#
# Ollama 0.33.3 answers `think:true` sent to a model with no reasoning channel
# with a hard error, not a shrug. Verified on this box:
#
#   think=true  -> ERROR: "qwen2.5:0.5b" does not support thinking
#   think=false -> ok
#
# Both `evidence-review` candidates (command-r:35b, aya-expanse:8b) are instruct
# models with no thinking channel, so `on` here failed every single run of this
# agent on a 24GB card. The harness sends the flag unconditionally
# (lib/runtime.sh `_rt_ollama_json`), so nothing about this was visible until a
# run happened - it passed every structural check.
#
# `off` is the safe direction: on a model that does think it costs some
# deliberation, whereas `on` on a model that does not is a total failure. If
# this role is ever given a reasoning candidate, raise this to "on" in the same
# edit that adds the candidate - tools/check-agents.py now fails the build if
# the two disagree.
AGENT_THINK="off"
# building  still being written. Not wired into anything yet.
# ready     passes its tests. Can be handed real work.
# active    in use, monitored on a schedule.
AGENT_STATUS="building"

# Filled in by tools/test-agent.sh
AGENT_LAST_TESTED="never"
AGENT_LAST_SCORE="never"
